[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qtrust"
version = "1.0.0"
description = "Cost-aware Bell-state error-detection benchmark for Qompute 2026 Track 3"
requires-python = ">=3.11"
dependencies = [
  "qiskit==2.5.2",
  "qiskit-aer==0.17.2",
  "numpy==2.5.4",
  "pandas==3.0.6",
  "matplotlib==3.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  'ignore:This process .* is multi-threaded, use of fork\(\) may lead to deadlocks in the child:DeprecationWarning:multiprocessing.popen_fork',
]


